<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fluxia · vídeo de marketing</title>
<style>
  @font-face { font-family: Lexend; font-weight: 300; src: url(../node_modules/@fontsource/lexend/files/lexend-latin-300-normal.woff2) format('woff2'); }
  @font-face { font-family: Lexend; font-weight: 400; src: url(../node_modules/@fontsource/lexend/files/lexend-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Lexend; font-weight: 500; src: url(../node_modules/@fontsource/lexend/files/lexend-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Lexend; font-weight: 600; src: url(../node_modules/@fontsource/lexend/files/lexend-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Lexend; font-weight: 700; src: url(../node_modules/@fontsource/lexend/files/lexend-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #0E1116; color: #cfd6df; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: auto; max-width: calc(100vh * 16 / 9 - 60px); margin: 0 auto; }
  .bar { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 10px; }
  body.render { background: #fff; }
  body.render canvas { width: 1920px; max-width: none; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶︎ Reproducir</button>
  <input id="seek" type="range" min="0" max="50" step="0.01" value="0" style="width:60%">
  <span id="time">0.00 s</span>
</div>
<audio id="music" src="../out/fluxia-marketing-50s.wav" preload="auto"></audio>
<script type="module">
  import { renderFrame, loadAssets } from './scene.js';
  import { DURATION } from './timeline.js';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const isRender = new URLSearchParams(location.search).has('render');
  if (isRender) document.body.classList.add('render');

  await Promise.all([300, 400, 500, 600, 700].map((w) => document.fonts.load(`${w} 20px Lexend`)));
  await loadAssets("../../public/", "../../animacion/");

  // API usada por render.mjs: dibuja el frame del instante t y lo devuelve como PNG.
  window.renderAt = (t) => { renderFrame(ctx, t); return canvas.toDataURL('image/png'); };
  window.draw = (t) => renderFrame(ctx, t);
  window.ready = true;

  // Vista previa en tiempo real (sincronizada con la música si existe out/fluxia-marketing-50s.wav).
  const audio = document.getElementById('music');
  const seek = document.getElementById('seek'), label = document.getElementById('time');
  let playing = false, t0 = 0, start = 0;
  const now = () => (audio.readyState >= 2 && !audio.error ? audio.currentTime : start + (performance.now() - t0) / 1000);
  function show(t) { renderFrame(ctx, t); seek.value = t; label.textContent = t.toFixed(2) + ' s'; }
  function loop() {
    if (!playing) return;
    const t = now();
    if (t >= DURATION) { playing = false; show(DURATION - 0.001); return; }
    show(t); requestAnimationFrame(loop);
  }
  document.getElementById('play').onclick = () => {
    playing = !playing;
    if (playing) {
      start = +seek.value >= DURATION - 0.05 ? 0 : +seek.value; t0 = performance.now();
      audio.currentTime = start; audio.play().catch(() => {});
      loop();
    } else audio.pause();
  };
  seek.oninput = () => { playing = false; audio.pause(); show(+seek.value); };
  show(+(new URLSearchParams(location.search).get('t') || 0));
</script>
</body>
</html>
