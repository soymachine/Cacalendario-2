# Supabase local para el simulador (tests/sim/local.sh). Solo lo necesario:
# base de datos, API, Auth y Storage. Las migraciones las genera local.sh a
# partir de supabase/schema/prod_baseline.sql; no edites supabase/migrations/ aquí.
project_id = "fluxia-sim"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Igual que producción: PostgREST devuelve como mucho 1000 filas por consulta.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4321"
enable_signup = true

[auth.email]
enable_signup = true
# Las cuentas simuladas entran sin confirmar el correo (no se envía nada).
enable_confirmations = false
