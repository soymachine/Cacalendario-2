<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada — Fluxia</title>
  <script>
    // La antigua web de pacientes (/user) ya no existe: ahora es la app.
    if (/^\/user(\/|$)/.test(window.location.pathname)) window.location.replace('/app/');
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #F4F7F3; color: #2D3539; text-align: center; }
    a { display: inline-block; margin: 6px; padding: 12px 20px; border-radius: 12px; background: #3C7DB8; color: #fff; font-weight: 700; text-decoration: none; }
    a.ghost { background: transparent; color: #3C7DB8; border: 1.5px solid #3C7DB8; }
  </style>
</head>
<body>
  <main>
    <h1>Página no encontrada</h1>
    <p>La dirección que buscas no existe.</p>
    <a href="/">Ir a Fluxia</a>
    <a class="ghost" href="/app/">Descargar la app</a>
  </main>
</body>
</html>
